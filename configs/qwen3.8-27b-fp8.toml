# Qwen3.8-27B official FP8 model configuration.
# Thinking is enabled by default. `reasoning_effort` accepts xhigh, medium, or low;
# `enable_thinking = false` selects the direct-response mode.

match  = ["qwen3.8-27b-fp8", "qwen3.8-27b-fp8-mtp", "Qwen/Qwen3.8-27B-FP8"]
source = "https://huggingface.co/Qwen/Qwen3.8-27B-FP8"

[capabilities]
vision           = { input = ["text", "image", "video"], output = ["text"] }
reasoning        = true
tool_call        = true
concurrency      = 4
thinking_control = "enable_thinking"

[context]
native       = 262144
min_thinking = 131072

[presets.reason]
thinking   = true
max_output = 81920
options.reasoning_effort = "xhigh"
[presets.reason.sampling]
temperature = 1.0
top_p       = 0.95
top_k       = 20

[presets.code]
thinking   = true
max_output = 32768
options.reasoning_effort = "xhigh"
[presets.code.sampling]
temperature = 1.0
top_p       = 0.95
top_k       = 20

[presets.agent]
thinking   = true
max_output = 32768
options.reasoning_effort = "xhigh"
options.chat_template_kwargs = { preserve_thinking = true }
[presets.agent.sampling]
temperature = 1.0
top_p       = 0.95
top_k       = 20

[presets.instruct]
thinking   = false
max_output = 32768
[presets.instruct.options.chat_template_kwargs]
enable_thinking = false
[presets.instruct.sampling]
temperature      = 0.7
top_p            = 0.80
top_k            = 20
presence_penalty = 1.5

[variants.xhigh]
options.reasoning_effort = "xhigh"
[variants.medium]
options.reasoning_effort = "medium"
[variants.low]
options.reasoning_effort = "low"
[variants.no-think]
options.chat_template_kwargs = { enable_thinking = false }
