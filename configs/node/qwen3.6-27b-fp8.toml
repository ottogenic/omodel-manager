# qwen3.6-27b-fp8 — sampling & thinking reference
#
# Official Qwen-team FP8 (e4m3) quantization of Qwen3.6-27B. Not an unsloth or
# third-party variant — this is the HuggingFace release from the Qwen team
# (Qwen/Qwen3.6-27B-FP8). Reasoning model, thinking ON by default, tool-calling.
# Shared by the omodel-manager `qwen3.6-27b-fp8-256k` and `-512k` launch profiles
# (sampling is per-model, not per-launch/context).
# Thinking off per request: chat_template_kwargs = { enable_thinking = false }.
# Anti-loop: temperature 0.6 (NOT 0) + presence_penalty on instruct.

match  = ["qwen3.6-27b-fp8", "Qwen/Qwen3.6-27B-FP8"]
source = "https://huggingface.co/Qwen/Qwen3.6-27B-FP8"

name = "Qwen 3.6 27B"
[capabilities]
vision           = { input = ["text", "image"], output = ["text"] }  # Qwen3.6-27B is multimodal (VL)
reasoning        = true
tool_call        = true
thinking_control = "enable_thinking"

[context]
native       = 262144
min_thinking = 131072

[presets.plan]                # planning & Q&A (card general thinking: temp 1.0)
thinking   = true
max_output = 81920
[presets.plan.sampling]
temperature = 1.0
top_p       = 0.95
top_k       = 20
min_p       = 0.0

[presets.build]               # precise coding / web dev (temp 0.6)
thinking   = true
max_output = 32768
[presets.build.sampling]
temperature = 0.6
top_p       = 0.95
top_k       = 20
min_p       = 0.0

[variants.think]
options.chat_template_kwargs = { enable_thinking = true }
[variants.no-think]
options.chat_template_kwargs = { enable_thinking = false }
