# Qwen3.8-27B NVFP4 with DFlash2 speculative decoding.
# Thinking is enabled by default. `reasoning_effort` accepts xhigh, medium, or low;
# `enable_thinking = false` selects the direct-response mode.

match  = ["qwen3.8-27b-nvfp4-vllm-dflash2", "RadixArk/Qwen3.8-27B-NVFP4"]
source = "https://huggingface.co/RadixArk/Qwen3.8-27B-NVFP4"

name = "Qwen 3.8 27B"
[capabilities]
vision           = { input = ["text", "image", "video"], output = ["text"] }
reasoning        = true
tool_call        = true
concurrency      = 1
thinking_control = "enable_thinking"

[context]
native       = 262144
min_thinking = 131072

[presets.plan]
thinking   = true
max_output = 81920
options.reasoning_effort = "xhigh"
[presets.plan.sampling]
temperature = 1.0
top_p       = 0.95
top_k       = 20

[presets.build]
thinking   = true
max_output = 32768
options.reasoning_effort = "xhigh"
[presets.build.sampling]
temperature = 1.0
top_p       = 0.95
top_k       = 20

[variants.xhigh]
options.reasoning_effort = "xhigh"
[variants.medium]
options.reasoning_effort = "medium"
[variants.low]
options.reasoning_effort = "low"
[variants.no-think]
options.chat_template_kwargs = { enable_thinking = false }
