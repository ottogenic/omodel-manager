# qwen3-coder-next-fp8 — sampling & thinking reference
#
# NVIDIA FP8 quant of Qwen3-Coder-Next (hybrid DeltaNet MoE: 80B total / ~3B active).
# Standard causal LM — no thinking/reasoning mode. Tool-calling. Launch via the
# omodel-manager `qwen3-coder-next-fp8` (official) or `unsloth-qwen3-coder-next-fp8` profile —
# both share this config.
# Values are STARTING POINTS to sweep from, not guarantees.
#
# Card sampling recommendation: temperature=1.0, top_p=0.95, top_k=40.

match  = ["qwen3-coder-next-fp8", "Qwen/Qwen3-Coder-Next-FP8", "unsloth/qwen3-coder-next-fp8", "unsloth/Qwen3-Coder-Next-FP8"]
source = "https://huggingface.co/Qwen/Qwen3-Coder-Next-FP8"

[capabilities]
vision           = false                  # pure text, no image support
reasoning        = false                  # standard causal LM, no reasoning mode
tool_call        = true                   # verified by card: OpenAI-compatible tool calling
thinking_control = "none"                 # no thinking mode -- standard causal LM
concurrency      = 4                      # mirrors the launch profile's max-num-seqs

[context]
native       = 262144

# Harness-agnostic Plan/Build task-mode presets. This model has no thinking mode.
# Sampling knobs (vLLM default in parens):
#   temperature (1.0)       1.0 = card default; 0.6–0.8 for focused coding.
#   top_p       (1.0)       0.95 = card recommended baseline.
#   top_k       (-1 off)    40 = card recommended.
#   min_p       (0.0)       alt tail cutoff; try 0.05–0.1.
#   presence_penalty  (0.0) anti-loop; +0.5…+1.5 breaks repetition.
#   frequency_penalty (0.0) 0.1–0.5 curbs verbatim repeats.
#   repetition_penalty(1.0) 1.05–1.15.
#   max_output              16k–32k for coding tasks.

[presets.plan]                # planning (no thinking)
thinking   = false
max_output = 32768
[presets.plan.sampling]
temperature      = 1.0        # card: General reasoning = 1.0
top_p            = 0.95
top_k            = 40         # card recommended
min_p            = 0.0

[presets.build]               # precise coding
thinking   = false
max_output = 32768
[presets.build.sampling]
temperature = 0.7             # card: coding uses slightly lower
top_p       = 0.95
top_k       = 40
min_p       = 0.0

# ── Variants (raw options only) ──────────────────────────────────────────────
[variants.think]
options.chat_template_kwargs = {}
[variants.no-think]
options.chat_template_kwargs = {}
