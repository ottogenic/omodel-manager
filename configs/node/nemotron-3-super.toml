# nemotron-3-super — sampling & thinking reference
#
# NVIDIA Nemotron-3-Super-120B-A12B-NVFP4 (hybrid Mamba+MoE+attention). Reasoning
# model, tool-calling. Launch via the omodel-manager `nemotron-3-super-120b-nvfp4-*`
# profiles. The card gives one sampling (temp 1.0, top_p 0.95) for both modes.
#
# thinking_control = "none": the adapter does NOT auto-inject Qwen-style knobs;
# each preset carries its own chat_template_kwargs. Nemotron has `low_effort`
# (a variant), not Qwen's clear/preserve_thinking.

match  = ["nemotron-3-super", "nemotron-3-super-120b-a12b-nvfp4-256k", "nemotron-3-super-120b-a12b-nvfp4-1m", "nvidia/nemotron-3-super", "Nemotron-3-Super", "NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"]
source = "https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"
thinking_control = "none"     # recipe-level: don't auto-inject; presets set options explicitly

[capabilities]
vision           = false
reasoning        = true
tool_call        = true
thinking_control = "enable_thinking"   # the model DOES support enable_thinking (used in presets below)

[context]
native = 1000000

[presets.plan]                # planning & Q&A
thinking = true
options.chat_template_kwargs = { enable_thinking = true }
[presets.plan.sampling]
temperature = 1.0
top_p       = 0.95

[presets.build]               # implementation
thinking = true
options.chat_template_kwargs = { enable_thinking = true }
[presets.build.sampling]
temperature = 1.0
top_p       = 0.95

# Ctrl+T thinking-depth variants (Nemotron uses low_effort, not clear_thinking)
[variants.think]
options.chat_template_kwargs = { enable_thinking = true }
[variants.think-low]
options.chat_template_kwargs = { enable_thinking = true, low_effort = true }
[variants.no-think]
options.chat_template_kwargs = { enable_thinking = false }
