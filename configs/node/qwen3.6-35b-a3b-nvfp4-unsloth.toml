# qwen3.6-35b-a3b-nvfp4-unsloth — sampling & thinking reference
#
# Unsloth NVFP4 quant of Qwen3.6-35B-A3B (MoE). compressed-tensors mixed
# FP8(dynamic/token) + NVFP4(dynamic), W4A4. Same base model as the nvidia-NVFP4
# and FP8 siblings — sampling is per-model, not per-quant, so the presets match
# them. Launch via the omodel-manager `qwen3.6-35b-a3b-nvfp4-unsloth` profile.
# Values are STARTING POINTS to sweep from, not guarantees.
#
# Anti-loop rule that matters on this checkpoint (thinking model): temperature
# NEVER 0; add presence_penalty when repetition appears (card allows 0-2).
# Keep max_output generous (>=32k) so thinking is not truncated.
#
# Thinking is a chat-template toggle (not a sampling param). Turn it off per
# request with  chat_template_kwargs = { enable_thinking = false }.

match  = ["qwen3.6-35b-a3b-nvfp4-unsloth", "unsloth/Qwen3.6-35B-A3B-NVFP4"]
source = "https://huggingface.co/unsloth/Qwen3.6-35B-A3B-NVFP4"

name = "Qwen 3.6 35B"
[capabilities]
vision           = { input = ["text", "image"], output = ["text"] }  # config.json: vision_config + image_token_id; verify live (4x4 blue PNG -> "Blue")
reasoning        = true
tool_call        = true
thinking_control = "enable_thinking"  # enable_thinking | reasoning_effort | soft_switch | none
concurrency      = 4                  # mirrors the launch profile's max-num-seqs

[context]
native       = 262144
min_thinking = 131072

# Harness-agnostic Plan/Build task-mode presets.
# Sampling knobs (vLLM default in parens):
#   temperature (1.0)       0.6 = focus; 0.8–1.0 = variety. NEVER 0 (loops on thinking models).
#   top_p       (1.0)       0.95 reasoning baseline; ~0.8 tightens.
#   top_k       (-1 off)    20 tightens cheaply.
#   min_p       (0.0)       alt tail cutoff; try 0.05–0.1.
#   presence_penalty  (0.0) anti-loop; +0.5…+1.5 breaks repetition; >1.5 risks language mixing.
#   frequency_penalty (0.0) 0.1–0.5 curbs verbatim repeats.
#   repetition_penalty(1.0) 1.05–1.15; don't stack hard with presence/frequency.
#   max_output              32k for thinking (the reasoning trace eats budget; too small = empty replies).

[presets.plan]                # planning (thinking on) -- card "Thinking / General"
thinking   = true
max_output = 32768
[presets.plan.sampling]
temperature      = 1.0        # card: General/reasoning thinking = 1.0
top_p            = 0.95
top_k            = 20
min_p            = 0.0
presence_penalty = 1.5        # card: General thinking presence_penalty = 1.5 (anti-loop)

[presets.build]               # precise coding (thinking on)
thinking   = true
max_output = 32768
[presets.build.sampling]
temperature      = 0.6        # card: precise coding
top_p            = 0.95
top_k            = 20
min_p            = 0.0

# ── Ctrl+T thinking-depth variants (raw options only) ────────────────────────
[variants.think]
options.chat_template_kwargs = { enable_thinking = true }
[variants.no-think]
options.chat_template_kwargs = { enable_thinking = false }
