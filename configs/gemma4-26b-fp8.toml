# gemma4-26b-fp8 — sampling & thinking reference
#
# Gemma 4 26B-A4B FP8-Dynamic (RedHatAI): the same Mixture-of-Experts base as the
# NVFP4 sibling — 26B total / ~3.8B active per token (8 of 128 experts + 1 shared),
# 1024-token sliding window. Text + image inputs, text output. Structured thinking
# via <|channel>thought delimiters; same custom tool-call protocol as the dense 31B.
#
# FP8-Dynamic: compressed-tensors e4m3 quantization of the MoE weights. On GB10 this
# beats NVFP4 because Blackwell has native FP8 hardware support, vs NVFP4's Marlin
# dequant fallback: ~37 tok/s decode at N=1 (~1.7–22 tok/s at N=4 under parallel
# slowdown). Requires vLLM >= 0.19.1 for the compressed-tensors MoE loader fixes
# (PRs #40708, #41683). The FP8 sibling that WORKS today while NVFP4 waits on #41683.
#
# sm_121 (GB10) serve notes: FlashInfer has FP8 accuracy bugs on Blackwell, so pin
# --attention-backend TRITON_ATTN; FP4 MoE kernels are unavailable, so --moe-backend
# marlin. kv-cache fp8 is recommended here (saves ~50% KV memory for longer contexts).
# TP=1 only in vLLM for this model.
#
# Thinking is controlled via chat_template_kwargs.enable_thinking (per-request) or
# --default-chat-template-kwargs (server-wide), same as the 31B / NVFP4 sibling.
#
# Verified: RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic card (serve flags + temp 1.0/
# top_p 0.95), GB10 decode measurement (~37 tok/s N=1). Same base model as the
# gemma4-26b-a4b-nvfp4 config — sampling is per-model, quant only changes serve flags.

match  = ["gemma4-26b-fp8", "RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic"]
source = "https://huggingface.co/RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic"

[capabilities]
vision           = { input = ["text", "image"], output = ["text"] }  # supports images; video via frame extraction
reasoning        = true
tool_call        = true
thinking_control = "enable_thinking"  # enable_thinking | reasoning_effort | soft_switch | none

[context]
native       = 262144
min_thinking = 131072

# ── Task-mode presets ────────────────────────────────────────────────────────
# Model card eval uses temperature=1.0, top_p=0.95, max_new_tokens=131072.
#   temperature (1.0)       1.0 = card baseline for reasoning; 0.6 for precise coding
#   top_p       (0.95)      card baseline; tighten to ~0.8 for focused tasks
#   top_k       (-1 off)    20 tightens cheaply
#   presence_penalty  (0.0) anti-loop; +0.5…+1.5 breaks repetition
#   max_output              32k for thinking (reasoning trace eats budget)

[presets.reason]              # research & planning (thinking on) -- card "General"
thinking   = true
max_output = 32768
[presets.reason.sampling]
temperature      = 1.0        # card: General/reasoning baseline
top_p            = 0.95

[presets.code]                # precise coding (thinking on)
thinking   = true
max_output = 32768
[presets.code.sampling]
temperature = 0.6
top_p       = 0.95
top_k       = 20

[presets.agent]               # unattended worker: coding sampling + preserved thinking
thinking   = true
max_output = 32768
options.chat_template_kwargs = { preserve_thinking = true }
[presets.agent.sampling]
temperature = 0.6
top_p       = 0.95
top_k       = 20

[presets.instruct]            # fast, no thinking
thinking   = false
max_output = 32768
[presets.instruct.sampling]
temperature = 0.7
top_p       = 0.80
top_k       = 20

# ── Ctrl+T thinking-depth variants (raw options only) ────────────────────────
[variants.think]
options.chat_template_kwargs = { enable_thinking = true }
[variants.no-think]
options.chat_template_kwargs = { enable_thinking = false }
