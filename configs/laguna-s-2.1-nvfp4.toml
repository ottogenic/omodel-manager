# laguna-s-2.1-nvfp4 — sampling & capability reference
#
# poolside Laguna-S-2.1, official NVFP4 quant (~72GB): 118B total / ~8.5B active MoE
# agentic coding model (256 experts top-10 + shared; 12 full-attn + 36 sliding-window
# layers). Interleaved thinking between tool calls; poolside_v1 parsers. OpenMDW-1.1.
# Launch via the omodel-manager `laguna-s-2.1-nvfp4` profile (vLLM >= 0.25.0 required).
# Values are STARTING POINTS to sweep from.
#
# NVFP4 card sampling: temperature=0.7, top_p=0.95, top_k=20.
# CAUTION: do NOT send min_p or logit_bias while DFlash speculative decoding is on
# (server 400s) — min_p left at 0.0 in every preset for that reason.

match  = ["laguna-s-2.1-nvfp4", "poolside/Laguna-S-2.1-NVFP4"]
source = "https://huggingface.co/poolside/Laguna-S-2.1-NVFP4"

[capabilities]
vision           = false                  # text-only
reasoning        = true                   # interleaved thinking (poolside_v1 reasoning parser)
tool_call        = true                   # poolside_v1 tool parser; agentic-first model
thinking_control = "enable_thinking"      # chat_template_kwargs; server default ON via launch flag
concurrency      = 4                       # mirrors launch profile max-num-seqs (DFlash-constrained)

[context]
native = 262144                            # poolside's quality ceiling for quantized checkpoints
                                           # (arch supports 1M via YaRN; degrades quantized)

[presets.reason]              # research & planning — thinking on
thinking   = true
max_output = 32768
[presets.reason.sampling]
temperature = 0.7
top_p       = 0.95
top_k       = 20

[presets.code]                # precise coding
thinking   = true
max_output = 32768
[presets.code.sampling]
temperature = 0.7
top_p       = 0.95
top_k       = 20

[presets.agent]               # unattended agentic loops — card recommends preserving
thinking   = true             # thinking across tool-call turns (interleaved by design)
max_output = 32768
[presets.agent.sampling]
temperature = 0.7
top_p       = 0.95
top_k       = 20

[presets.instruct]            # quick answers — thinking off
thinking   = false
max_output = 16384
[presets.instruct.sampling]
temperature = 0.7
top_p       = 0.95
top_k       = 20

[variants.think]
options.chat_template_kwargs = { enable_thinking = true }
[variants.no-think]
options.chat_template_kwargs = { enable_thinking = false }
