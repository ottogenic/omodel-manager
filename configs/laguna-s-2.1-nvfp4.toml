# laguna-s-2.1-nvfp4 — sampling & capability reference
#
# poolside Laguna-S-2.1 RC2, official NVFP4/BF16 hybrid (99.7GB): 118B total / ~8.5B active MoE
# agentic coding model (256 experts top-10 + shared; 12 full-attn + 36 sliding-window
# layers). Interleaved thinking between tool calls; poolside_v1 parsers. OpenMDW-1.1.
# Launch via the omodel-manager `laguna-s-2.1-nvfp4` profile (vLLM >= 0.25.0 required).
# Values are STARTING POINTS to sweep from.
#
# ── Sampling: checkpoint defaults, ALL modes (verified 2026-08-09) ──
# RC2's authoritative generation_config.json sets temperature 1.0 + top_p 1.0 +
# top_k 20 + min_p 0.0. There is NO official coding-vs-reasoning split,
# and NO effort levels in this release ("two thinking settings: off and max" —
# https://docs.poolside.ai/release-notes/models). Identical presets below are
# deliberate, not an oversight.
#   card:  https://huggingface.co/poolside/Laguna-S-2.1-NVFP4
#   gen:   https://huggingface.co/poolside/Laguna-S-2.1-NVFP4/raw/main/generation_config.json
# min_p is intentionally absent: the server supplies the checkpoint's 0.0 default,
# and nonzero min_p is incompatible with the separate DFlash profile.
#
# ── Re-thinking loops ("But wait… But wait…") — known issue, sourced 2026-07-25 ──
# Mild re-verification is this model's intended "persistent verification" style, and
# overthinking is a vendor-acknowledged limitation ("may think for long sequences
# before making progress" — https://poolside.ai/blog/introducing-laguna-s-2-1).
# Hard loops (verbatim repeats until finish_reason: length) are a STAFF-CONFIRMED
# defect, worst in 4-bit quants. The August RC2 replacement is pinned by the launch
# profile, but poolside has not published a controlled before/after termination test:
#   https://huggingface.co/poolside/Laguna-S-2.1-NVFP4/discussions/7   (staff fix)
#   https://huggingface.co/poolside/Laguna-S-2.1-NVFP4/discussions/10  (post-fix repro)
# Documented mitigations, in order of evidence:
#   1. repetition_penalty 1.10-1.15 — rescued 4/8 previously-0/8 runs in the
#      discussions/10 repro. NOT set below: it penalizes legitimately repetitive
#      code tokens (warned in-thread) — quality-first default is off; add per-request
#      if a task loops to the length limit.
#   2. preserve_thinking in agent loops (set below) — official base-card rec, and one
#      report of it stopping tool-call looping (discussions/5).
#   3. thinking_token_budget does NOT work for this model on vLLM (accepted silently,
#      no effect — https://huggingface.co/poolside/Laguna-S-2.1-NVFP4/discussions/9).
#      Don't reach for it.

match  = ["laguna-s-2.1-nvfp4", "poolside/Laguna-S-2.1-NVFP4"]
source = "https://huggingface.co/poolside/Laguna-S-2.1-NVFP4"

[capabilities]
vision           = false                  # text-only
reasoning        = true                   # interleaved thinking (poolside_v1 reasoning parser)
tool_call        = true                   # poolside_v1 tool parser; agentic-first model
thinking_control = "enable_thinking"      # chat_template_kwargs; server default ON via launch flag
concurrency      = 1                       # RC2's 99.7GB target leaves limited KV headroom on GB10

[context]
native = 229376                            # validated serving cap for the target-only Spark profile
                                           # (RC2 arch/config supports 1M; card recipe uses 256K)

[presets.reason]              # research & planning — thinking on
thinking   = true
max_output = 32768
[presets.reason.sampling]
temperature = 1.0
top_p       = 1.0
top_k       = 20

[presets.code]                # precise coding
thinking   = true
max_output = 32768
[presets.code.sampling]
temperature = 1.0
top_p       = 1.0
top_k       = 20

[presets.agent]               # unattended agentic loops. preserve_thinking is the
thinking   = true             # OFFICIAL agentic rec: "works best with preserved
max_output = 32768            # thinking… may stop reasoning in follow-up steps if
                              # prior thinking blocks are dropped"
                              # (https://huggingface.co/poolside/Laguna-S-2.1)
options.chat_template_kwargs = { preserve_thinking = true }
[presets.agent.sampling]
temperature = 1.0
top_p       = 1.0
top_k       = 20

[presets.instruct]            # quick answers — thinking off (loops live in thinking;
thinking   = false            # this mode sidesteps them entirely)
max_output = 16384
[presets.instruct.sampling]
temperature = 1.0
top_p       = 1.0
top_k       = 20

[variants.think]
options.chat_template_kwargs = { enable_thinking = true }
[variants.no-think]
options.chat_template_kwargs = { enable_thinking = false }
