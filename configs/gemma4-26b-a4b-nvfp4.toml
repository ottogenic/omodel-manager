# gemma4-26b-a4b — sampling & thinking reference
#
# Gemma 4 26B-A4B NVFP4: the Mixture-of-Experts sibling of the dense 31B.
# 25.2B total / 3.8B active per token (8 of 128 experts + 1 shared), 1024-token
# sliding window. Text + image inputs, text output. Structured thinking via
# <|channel>thought delimiters; same custom tool-call protocol as the 31B.
#
# NVFP4: MLP/expert + embedding weights are 4-bit (ModelOpt); attention stays BF16.
# ~16.5GB weights leave ~82GB for KV cache on a 128GB Spark. Only 3.8B active params
# are read per decode step, so on the 273 GB/s GB10 bus it runs ~52 tok/s vs the
# dense 31B's ~7 (ai-muninn DGX Spark benchmark) -- the Spark's pick for latency.
#
# sm_121 (GB10) has no native FP4 MoE kernels: serve with --moe-backend marlin to force the
# working Marlin FP4 dequant path (the CUTLASS/FlashInfer FP4 MoE path gives garbage; leave the
# linear GEMM on auto = FlashInfer CUTLASS). TP=1 only in vLLM for this model.
#
# Thinking is controlled via chat_template_kwargs.enable_thinking (per-request) or
# --default-chat-template-kwargs (server-wide), same as the 31B.
#
# Verified: nvidia/Gemma-4-26B-A4B-NVFP4 card (serve flags + temp 1.0/top_p 0.95),
# ai-muninn DGX Spark benchmark. Live validation TBD on Blackwell hardware.

match  = ["gemma4-26b-a4b-nvfp4", "nvidia/Gemma-4-26B-A4B-NVFP4", "Gemma-4-26B-A4B"]
source = "https://huggingface.co/nvidia/Gemma-4-26B-A4B-NVFP4"

[capabilities]
vision           = { input = ["text", "image"], output = ["text"] }  # supports images; video via frame extraction
reasoning        = true
tool_call        = true
thinking_control = "enable_thinking"  # enable_thinking | reasoning_effort | soft_switch | none

[context]
native       = 262144
min_thinking = 131072

# ── Task-mode presets ────────────────────────────────────────────────────────
# Model card eval uses temperature=1.0, top_p=0.95, max_new_tokens=131072.
#   temperature (1.0)       1.0 = card baseline for reasoning; 0.6 for precise coding
#   top_p       (0.95)      card baseline; tighten to ~0.8 for focused tasks
#   top_k       (-1 off)    20 tightens cheaply
#   presence_penalty  (0.0) anti-loop; +0.5…+1.5 breaks repetition
#   max_output              32k for thinking (reasoning trace eats budget)

[presets.reason]              # research & planning (thinking on) -- card "General"
thinking   = true
max_output = 32768
[presets.reason.sampling]
temperature      = 1.0        # card: General/reasoning baseline
top_p            = 0.95

[presets.code]                # precise coding (thinking on)
thinking   = true
max_output = 32768
[presets.code.sampling]
temperature = 0.6
top_p       = 0.95
top_k       = 20

[presets.agent]               # unattended worker: coding sampling + preserved thinking
thinking   = true
max_output = 32768
options.chat_template_kwargs = { preserve_thinking = true }
[presets.agent.sampling]
temperature = 0.6
top_p       = 0.95
top_k       = 20

[presets.instruct]            # fast, no thinking
thinking   = false
max_output = 32768
[presets.instruct.sampling]
temperature = 0.7
top_p       = 0.80
top_k       = 20

# ── Ctrl+T thinking-depth variants (raw options only) ────────────────────────
[variants.think]
options.chat_template_kwargs = { enable_thinking = true }
[variants.no-think]
options.chat_template_kwargs = { enable_thinking = false }
