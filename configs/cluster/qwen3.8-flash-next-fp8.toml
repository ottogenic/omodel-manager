# Qwen3.8-Flash-Next official FP8 model configuration. Image input is validated;
# video is intentionally excluded because it crashed the pinned preview runtime.
# Thinking is enabled by default. `reasoning_effort` accepts xhigh, medium, or low;
# `enable_thinking = false` selects direct-response mode.

match  = ["qwen3.8-flash-next-fp8", "Qwen/Qwen3.8-Flash-Next-FP8"]
source = "https://huggingface.co/Qwen/Qwen3.8-Flash-Next-FP8"

name = "Qwen 3.8 Flash Next"
[capabilities]
vision           = { input = ["text", "image"], output = ["text"] }
reasoning        = true
tool_call        = true
concurrency      = 1
thinking_control = "enable_thinking"

[context]
native = 262144

[presets.plan]
thinking   = true
max_output = 131072
options.reasoning_effort = "xhigh"
[presets.plan.sampling]
temperature = 1.0
top_p       = 0.95
top_k       = 20

[presets.build]
thinking   = true
max_output = 131072
options.reasoning_effort = "xhigh"
[presets.build.sampling]
temperature = 1.0
top_p       = 0.95
top_k       = 20

[variants.xhigh]
options.reasoning_effort = "xhigh"
[variants.medium]
options.reasoning_effort = "medium"
[variants.low]
options.reasoning_effort = "low"
[variants.no-think]
options.chat_template_kwargs = { enable_thinking = false }
